<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دنیای انیمیشن | Animation World</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
        }
    </style>
</head>
<body class="bg-[#1e1b4b] text-white min-h-screen flex flex-col justify-between selection:bg-purple-500 selection:text-white">

    <!-- هدر سایت -->
    <header class="bg-[#2e2a72]/80 backdrop-blur-md border-b border-purple-900/50 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <!-- منوها -->
            <nav class="hidden md:flex items-center gap-6 text-sm text-purple-200 font-medium">
                <a href="#" class="hover:text-white transition">انیمیشن سینمایی</a>
                <a href="#" class="hover:text-white transition">سریال</a>
                <a href="#" class="hover:text-white transition">مجموعه‌ها</a>
                <a href="#" class="hover:text-white transition">فیلم‌مدرسه</a>
            </nav>

            <!-- لوگو و نام سایت -->
            <div class="flex items-center gap-2">
                <span class="text-lg font-black tracking-wide text-white">دنیای انیمیشن</span>
                <div class="w-8 h-8 bg-purple-600 rounded-xl flex items-center justify-center text-white text-sm font-bold shadow-lg shadow-purple-600/40">🎬</div>
            </div>
        </div>
    </header>

    <!-- بخش جستجو و محتوای اصلی -->
    <main class="container mx-auto px-4 py-12 flex-grow">
        <!-- نوار جستجو -->
        <div class="max-w-2xl mx-auto mb-12 text-center">
            <h1 class="text-3xl md:text-4xl font-black mb-6 tracking-tight">به <span class="text-purple-400">دنیای انیمیشن</span> خوش آمدید</h1>
            <div class="flex gap-2 bg-[#2e2a72]/60 p-2 rounded-2xl border border-purple-900/60 shadow-xl">
                <input type="text" placeholder="جستجوی انیمیشن، کارتون، سریال..." class="bg-transparent px-4 py-3 w-full text-sm text-white placeholder-purple-300/60 focus:outline-none">
                <button class="bg-purple-600 hover:bg-purple-500 text-white px-6 py-3 rounded-xl font-semibold text-sm transition cursor-pointer shadow-md shadow-purple-600/30">جستجو</button>
            </div>
        </div>

        <!-- بخش نمایش انیمیشن‌ها -->
        <section class="max-w-4xl mx-auto">
            <h2 class="text-xl font-bold mb-6 text-purple-200 border-r-4 border-purple-500 pr-3">انیمیشن‌های ویژه</h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                <!-- کارت باب اسفنجی -->
                <div class="bg-[#2e2a72]/40 border border-purple-900/50 rounded-2xl overflow-hidden shadow-lg hover:border-purple-500/50 transition group">
                    <div class="h-56 bg-[#25225c] flex flex-col items-center justify-center text-white relative group-hover:scale-105 transition duration-300">
                        <span class="text-5xl mb-2">🧽</span>
                        <span class="text-xs font-bold bg-yellow-500 text-slate-950 px-2.5 py-1 rounded-full absolute top-3 right-3 shadow">محبوب</span>
                    </div>
                    <div class="p-4">
                        <h3 class="font-bold text-base mb-1 text-white">باب اسفنجی شلوارمکعبی</h3>
                        <p class="text-xs text-purple-300/70 mb-3" dir="ltr">SpongeBob SquarePants</p>
                        <div class="flex justify-between items-center text-xs text-purple-200 mb-4 bg-[#1e1b4b] p-2.5 rounded-xl border border-purple-900/40">
                            <span>⭐ امتیاز: 8</span>
                            <span>کمدی، خانوادگی</span>
                        </div>
                        <a href="SpongeBobSquarePants.html" class="block text-center w-full bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold py-2.5 rounded-xl transition cursor-pointer shadow-md shadow-purple-600/30">تماشا</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- فوتر -->
    <footer class="bg-[#17153a] border-t border-purple-900/40 py-6 text-center text-xs text-purple-400/60">
        <p>تمامی حقوق محفوظ است &copy; ۲۰۲۶ - دنیای انیمیشن (Animation World)</p>
    </footer>

</body>
</html>
